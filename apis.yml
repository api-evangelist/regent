aid: regent
name: REGENT Craft
description: >-
  REGENT Craft Inc. is a Rhode Island maritime mobility manufacturer building the Seaglider, an
  all-electric wing-in-ground-effect (WIG) vessel that floats on its hull, hydrofoils, and then flies
  within a wingspan of the water's surface at up to 180 mph. The company builds the 12-passenger
  Viceroy, the larger Monarch, and the uncrewed Squire defense drone, and operates a defense product
  line for ISR, contested logistics and MEDEVAC missions. REGENT is a vehicle manufacturer rather
  than a software company: it publishes no developer program, no public API and no machine-readable
  API contract. It does serve a real, hand-authored llms.txt at its website root, which is the only
  machine-readable artifact on its public surface.
